<svg xmlns="http://www.w3.org/2000/svg" width="800" height="50">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6e40c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo com gradiente -->
  <rect width="100%" height="100%" rx="8" fill="url(#grad)"/>
  
  <!-- Área escura para as linguagens -->
  <rect x="170" y="5" width="620" height="40" rx="6" fill="#1a1a2e"/>
  
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="bold">
    🚀 LINGUAGENS
  </text>
  
  <!-- Os placeholders serão substituídos pelo script -->
  {{LANGUAGES}}
</svg>